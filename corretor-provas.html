const GOOGLE_CLIENT_ID = "137378248761-rmic9jn87lejjvn9b8tpenj5bnqbbu57.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";

// ─── AUTH & DRIVE ──────────────────────────────────────────────────────────────
function getTokenDaUrl(){
  const hash=new URLSearchParams(window.location.hash.slice(1));
  const token=hash.get("access_token");
  if(token){ history.replaceState(null,"",window.location.pathname); return token; }
  return null;
}
function loginGoogle(){
  const redirectUri=window.location.origin+window.location.pathname;
  const params=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:redirectUri,response_type:"token",scope:SCOPES,prompt:"consent"});
  window.location.href="https://accounts.google.com/o/oauth2/v2/auth?"+params.toString();
}
async function buscarUsuario(t){const r=await fetch("https://www.googleapis.com/oauth2/v2/userinfo",{headers:{Authorization:"Bearer "+t}});return r.json();}
async function lerDrive(t){
  const params=new URLSearchParams({spaces:"appDataFolder",q:"name='provas_zelinda.json'",fields:"files(id,name)"});
  const lr=await fetch("https://www.googleapis.com/drive/v3/files?"+params.toString(),{headers:{Authorization:"Bearer "+t}});
  const list=await lr.json();
  console.log("[Drive] lista:",JSON.stringify(list));
  if(!list.files||!list.files[0])return null;
  const fr=await fetch("https://www.googleapis.com/drive/v3/files/"+list.files[0].id+"?alt=media",{headers:{Authorization:"Bearer "+t}});
  return fr.json();
}

// ─── EXCEL EXPORT ─────────────────────────────────────────────────────────────
function exportarExcel(correcoes,prova){
  const dados=correcoes.map(c=>({"Nome do Aluno":c.nomeAluno,"Turma":c.turma,"Acertos":c.acertos+"/"+c.total,"Nota":parseFloat(c.nota),"Data":c.data,"Disciplina":prova.disciplina||"","Assunto":prova.assunto||""}));
  const ws=XLSX.utils.json_to_sheet(dados);
  ws["!cols"]=[{wch:30},{wch:12},{wch:12},{wch:8},{wch:16},{wch:16},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Notas");
  const titulo=(prova.titulo||"notas").replace(/[^a-z0-9]/gi,"_");
  XLSX.writeFile(wb,titulo+".xlsx");
}

// ─── TELA LOGIN ────────────────────────────────────────────────────────────────
function TelaLogin({onLogin}){
  const [loading,setLoading]=React.useState(false);
  const [erro,setErro]=React.useState("");
  React.useEffect(()=>{
    const token=getTokenDaUrl();
    if(token){
      setLoading(true);
      buscarUsuario(token)
        .then(u=>lerDrive(token).then(d=>onLogin(token,u,d||{provas:[],alunos:[]})))
        .catch(e=>{setErro("Erro: "+e.message);setLoading(false);});
    }
  },[]);
  function handle(){setLoading(true);loginGoogle();}
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)",padding:"24px"}}>

        <div style={{width:"72px",height:"72px",borderRadius:"50%",background:"linear-gradient(135deg,#4361ee,#7209b7)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:"16px",boxShadow:"0 8px 24px rgba(67,97,238,0.4)",fontSize:"30px"}}>&#128221;</div>
        <h1 style={{fontSize:"22px",fontWeight:"700",color:"#1a1a2e",marginBottom:"4px"}}>Corretor de Provas</h1>
        <p style={{fontSize:"13px",color:"#7209b7",fontWeight:"600",marginBottom:"20px",textTransform:"uppercase",letterSpacing:"1px"}}>DO MEU AMOR</p>
        <div style={{width:"36px",height:"3px",background:"linear-gradient(90deg,#4361ee,#7209b7)",borderRadius:"2px",marginBottom:"20px"}}/>
        <p style={{fontSize:"14px",color:"#666",textAlign:"center",lineHeight:"1.6",marginBottom:"24px"}}>Entre com a conta Google para acessar as provas e alunos sincronizados.</p>
        <button onClick={handle} disabled={loading} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"10px",width:"100%",padding:"14px",background:"#fff",border:"2px solid #e8e8e8",borderRadius:"12px",fontSize:"15px",fontWeight:"600",color:"#333",boxShadow:"0 2px 8px rgba(0,0,0,0.08)",marginBottom:"14px",opacity:loading?0.6:1}}>
          {loading?<><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>&#9203;</span> Conectando...</>:<><GIcon/> Entrar com Google</>}
        </button>
        {erro&&<div style={{width:"100%",padding:"12px",background:"#fff3f3",border:"1px solid #ffcdd2",borderRadius:"8px",color:"#c62828",fontSize:"13px",textAlign:"center"}}>{erro}</div>}
      </div>
    </div>
  );
}

  return(
    <div style={{minHeight:"100vh",background:"#f5f6fa"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",padding:"48px 20px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
          <div>
            <p style={{color:"rgba(255,255,255,0.6)",fontSize:"13px",marginBottom:"2px"}}>Bem-vinda,</p>
            <p style={{color:"#fff",fontWeight:"700",fontSize:"18px"}}>{usuario?.given_name||"Professora"} &#128075;</p>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            {usuario?.picture&&<img src={usuario.picture} alt="" style={{width:"42px",height:"42px",borderRadius:"50%",border:"2px solid rgba(255,255,255,0.3)"}}/>}
            <button onClick={onLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:"8px",padding:"8px 12px",color:"#fff",fontSize:"12px",cursor:"pointer"}}>Sair</button>

        </div>

          <span style={{color:"rgba(255,255,255,0.5)"}}>&#128269;</span>

// ─── TELA SELECIONAR TURMA+ALUNO ──────────────────────────────────────────────
function TelaAluno({prova,alunos,correcoes,onConfirmar,onVoltar}){
  const ANOS=["1º ano","2º ano","3º ano"];
  const TURMAS=["A","B","C","D","E"];
  const [ano,setAno]=React.useState("");
  const [turma,setTurma]=React.useState("");
  const [alunoId,setAlunoId]=React.useState("");
  const alunosFiltrados=alunos.filter(a=>(!ano||a.ano===ano)&&(!turma||a.turma===turma));
  const jaCorrigidos=new Set(correcoes.map(c=>c.alunoId));
  const pendentes=alunosFiltrados.filter(a=>!jaCorrigidos.has(a.id));
  return(
    <div style={{minHeight:"100vh",background:"#f5f6fa"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",padding:"48px 20px 24px"}}>
        <button onClick={onVoltar} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",fontSize:"14px",cursor:"pointer",marginBottom:"14px",padding:0}}>&#8592; Voltar</button>
        <p style={{color:"rgba(255,255,255,0.6)",fontSize:"12px",marginBottom:"4px"}}>Selecionando aluno para</p>
        <p style={{color:"#fff",fontWeight:"700",fontSize:"17px"}}>{prova.titulo}</p>
        <p style={{color:"rgba(255,255,255,0.5)",fontSize:"12px",marginTop:"4px"}}>{prova.total_questoes} questoes · {correcoes.length} ja corrigidos</p>
      </div>
      <div style={{padding:"20px 16px"}}>
        <div style={{background:"#fff",borderRadius:"14px",padding:"20px",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",marginBottom:"16px"}}>
          <p style={{fontWeight:"700",fontSize:"15px",color:"#1a1a2e",marginBottom:"16px"}}>Selecionar turma</p>
          <div style={{display:"flex",gap:"10px",marginBottom:"14px"}}>
            <select style={{flex:1,padding:"10px",border:"1px solid #ddd",borderRadius:"8px",fontSize:"14px",outline:"none"}} value={ano} onChange={e=>setAno(e.target.value)}>
              <option value="">Todos os anos</option>
              {ANOS.map(a=><option key={a}>{a}</option>)}
            </select>
            <select style={{flex:1,padding:"10px",border:"1px solid #ddd",borderRadius:"8px",fontSize:"14px",outline:"none"}} value={turma} onChange={e=>setTurma(e.target.value)}>
              <option value="">Todas as turmas</option>
              {TURMAS.map(t=><option key={t} value={t}>Turma {t}</option>)}
            </select>
          </div>
          {alunosFiltrados.length>0&&(
            <>
              <p style={{fontSize:"12px",fontWeight:"600",color:"#999",marginBottom:"8px",textTransform:"uppercase",letterSpacing:"0.6px"}}>{pendentes.length} pendentes de {alunosFiltrados.length} alunos</p>
              <select style={{width:"100%",padding:"12px",border:"2px solid #4361ee33",borderRadius:"10px",fontSize:"15px",outline:"none",background:"#f8f9ff"}} value={alunoId} onChange={e=>setAlunoId(e.target.value)}>
                <option value="">Selecione o aluno...</option>
                {pendentes.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
                {jaCorrigidos.size>0&&<option disabled>── Ja corrigidos ──</option>}
                {alunosFiltrados.filter(a=>jaCorrigidos.has(a.id)).map(a=><option key={a.id} value={a.id}>✓ {a.nome}</option>)}
              </select>
            </>
          )}
          {alunosFiltrados.length===0&&ano&&turma&&(
            <p style={{color:"#e63946",fontSize:"14px",textAlign:"center",padding:"16px 0"}}>Nenhum aluno cadastrado para {ano} Turma {turma}.<br/><span style={{fontSize:"12px",color:"#aaa"}}>Cadastre alunos no computador.</span></p>
          )}
        </div>
        <button onClick={()=>{if(!alunoId){alert("Selecione um aluno.");return;}const al=alunos.find(a=>a.id==alunoId);onConfirmar(al,turma||al.turma);}} disabled={!alunoId}
          style={{width:"100%",padding:"15px",background:"linear-gradient(135deg,#4361ee,#7209b7)",border:"none",borderRadius:"12px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:"pointer",opacity:alunoId?1:0.4,boxShadow:"0 4px 14px rgba(67,97,238,0.3)"}}>
          &#128247; Tirar Foto do Cartao
        </button>
      </div>
    </div>
  );
}

// ─── ANALISE OPENCV ────────────────────────────────────────────────────────────
async function analisarCartao(imgEl, totalQ) {
  // Aguarda o OpenCV carregar se necessário
  if (typeof cv === "undefined" || !cv.Mat) await new Promise(r => setTimeout(r, 2000));

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  ctx.drawImage(imgEl, 0, 0);

  const src = cv.matFromImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
  const gray = new cv.Mat(), thresh = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

  const W = canvas.width, H = canvas.height;
  const LETRAS = ["A", "B", "C", "D", "E"];
  const totalBlocos = Math.ceil(totalQ / 10);
  const respostas = [];

  // Conta pixels escuros em uma região da imagem
  function contarEscuros(xc, yc, wc, hc) {
    let escuros = 0;
    const total = wc * hc;
    if (total === 0) return 0;
    for (let py = yc; py < Math.min(yc + hc, H); py++)
      for (let px = xc; px < Math.min(xc + wc, W); px++)
        if (thresh.ucharAt(py, px) > 128) escuros++;
    return escuros / total;
  }

  for (let b = 0; b < totalBlocos; b++) {
    const ini = b * 10, fim = Math.min(ini + 10, totalQ), qtd = fim - ini;

    // Divide a altura da imagem igualmente entre os blocos
    const blocoH = H / totalBlocos;
    const yBloco = b * blocoH;

    // Cada bloco tem 6 linhas: 1 header (números) + 5 letras (A-E)
    const linhaH = blocoH / 6;

    // Coluna da label (~8% da largura) — ignorada
    const labelW = W * 0.08;
    const areaW  = W - labelW;
    const colW   = areaW / qtd;

    for (let qi = 0; qi < qtd; qi++) {
      // Coleta a densidade de pixels escuros para cada alternativa (A-E)
      const densidades = [];

      for (let li = 0; li < 5; li++) {
        // Linha li+1 (pula o header que é li=0)
        // Recorte central da célula (15% de margem em cada lado)
        const yc = Math.floor(yBloco + (li + 1.15) * linhaH);
        const hc = Math.floor(linhaH * 0.7);
        const xc = Math.floor(labelW + qi * colW + colW * 0.15);
        const wc = Math.floor(colW * 0.7);
        densidades.push(contarEscuros(xc, yc, wc, hc));
      }

      const maxDens = Math.max(...densidades);
      const minDens = Math.min(...densidades);
      const idxMax  = densidades.indexOf(maxDens);

      // ✅ Considera marcada apenas se:
      // 1. A bolinha mais escura tem pelo menos 15% de pixels preenchidos
      // 2. É pelo menos 2x mais escura que a mais clara
      //    (evita marcar quando todas as bolinhas estão parecidas = cartão em branco)
      const marcada = maxDens > 0.15 && maxDens > minDens * 2.0;

      respostas.push(marcada ? LETRAS[idxMax] : null);
    }
  }

  src.delete(); gray.delete(); thresh.delete();
  return respostas;
}

// ─── TELA CORRECAO ─────────────────────────────────────────────────────────────
function TelaCorrecao({prova,aluno,turma,onSalvar,onVoltar}){
  const [etapa,setEtapa]=React.useState("instrucao");
  const [fotoUrl,setFotoUrl]=React.useState(null);
  const [imgEl,setImgEl]=React.useState(null);
  const [respostas,setRespostas]=React.useState([]);
  const [erro,setErro]=React.useState("");
  const fileRef=React.useRef();
  const gabarito=prova.gabarito_sequencia?.split(",")||[];
  const total=prova.total_questoes||0;

  function onFoto(e){
    const f=e.target.files[0];if(!f)return;
    const url=URL.createObjectURL(f);setFotoUrl(url);
    const img=new Image();img.onload=()=>setImgEl(img);img.src=url;
    setEtapa("foto");
  }
  async function handleAnalisar(){
    if(!imgEl)return;setEtapa("analisando");setErro("");
    try{const r=await analisarCartao(imgEl,total);setRespostas(r);setEtapa("resultado");}
    catch(e){setErro("Erro: "+e.message);setEtapa("foto");}
  }

  const acertos=respostas.filter((r,i)=>r&&r===(gabarito[i]||"").toUpperCase()).length;
  const nota=total>0?((acertos/total)*10).toFixed(1):"0";

  if(etapa==="instrucao")return(
    <div style={{minHeight:"100vh",background:"#f5f6fa"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",padding:"48px 20px 24px"}}>
        <button onClick={onVoltar} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",fontSize:"14px",cursor:"pointer",marginBottom:"14px",padding:0}}>&#8592; Voltar</button>
        <p style={{color:"rgba(255,255,255,0.6)",fontSize:"12px",marginBottom:"4px"}}>Corrigindo cartao de</p>
        <p style={{color:"#fff",fontWeight:"700",fontSize:"18px"}}>{aluno.nome}</p>
        <p style={{color:"rgba(255,255,255,0.5)",fontSize:"12px",marginTop:"4px"}}>{aluno.ano} · Turma {turma} · {prova.titulo}</p>
      </div>
      <div style={{padding:"20px 16px"}}>
        <div className="fadein" style={{background:"#fff",borderRadius:"16px",padding:"24px",boxShadow:"0 2px 10px rgba(0,0,0,0.07)",marginBottom:"16px"}}>
          <p style={{fontWeight:"700",fontSize:"16px",marginBottom:"16px",color:"#1a1a2e"}}>&#128247; Como tirar a foto</p>
          {["Coloque o cartao em superficie plana e bem iluminada","Enquadre apenas o cartao de respostas, sem cortar","Evite sombras sobre as celulas","Foto reta, sem inclinacao"].map((d,i)=>(
            <div key={i} style={{display:"flex",gap:"12px",marginBottom:"12px",alignItems:"flex-start"}}>
              <div style={{width:"24px",height:"24px",borderRadius:"50%",background:"linear-gradient(135deg,#4361ee,#7209b7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontSize:"12px",fontWeight:"700"}}>{i+1}</div>
              <p style={{fontSize:"14px",color:"#444",lineHeight:"1.5",paddingTop:"2px"}}>{d}</p>
            </div>
          ))}
        </div>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={onFoto}/>
        <button onClick={()=>fileRef.current.click()} style={{width:"100%",padding:"16px",background:"linear-gradient(135deg,#4361ee,#7209b7)",border:"none",borderRadius:"14px",color:"#fff",fontSize:"16px",fontWeight:"700",cursor:"pointer",boxShadow:"0 4px 16px rgba(67,97,238,0.4)"}}>
          &#128247; Tirar Foto do Cartao
        </button>
      </div>
    </div>
  );

  if(etapa==="foto")return(
    <div style={{minHeight:"100vh",background:"#111",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"16px 20px",background:"#1a1a2e",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={()=>setEtapa("instrucao")} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",fontSize:"14px",cursor:"pointer"}}>&#8592;</button>
        <p style={{color:"#fff",fontWeight:"600",fontSize:"14px"}}>{aluno.nome}</p>
        <div style={{width:"40px"}}/>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}}>
        {fotoUrl&&<img src={fotoUrl} alt="cartao" style={{maxWidth:"100%",maxHeight:"60vh",borderRadius:"8px",objectFit:"contain"}}/>}
      </div>
      {erro&&<div style={{margin:"0 16px 12px",padding:"12px",background:"#fff3f3",borderRadius:"10px",color:"#c62828",fontSize:"13px",textAlign:"center"}}>{erro}</div>}
      <div style={{padding:"16px 20px 32px",display:"flex",gap:"12px"}}>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={onFoto}/>
        <button onClick={()=>fileRef.current.click()} style={{flex:1,padding:"14px",background:"rgba(255,255,255,0.1)",border:"2px solid rgba(255,255,255,0.2)",borderRadius:"12px",color:"#fff",fontSize:"14px",fontWeight:"600",cursor:"pointer"}}>Refazer</button>
        <button onClick={handleAnalisar} style={{flex:2,padding:"14px",background:"linear-gradient(135deg,#4361ee,#7209b7)",border:"none",borderRadius:"12px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:"pointer"}}>&#10003; Analisar</button>
      </div>
    </div>
  );

  if(etapa==="analisando")return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#f5f6fa",gap:"20px",padding:"40px"}}>
      <div className="spinner"/>
      <p style={{fontWeight:"700",fontSize:"18px",color:"#1a1a2e"}}>Analisando cartao...</p>
    </div>
  );

  if(etapa==="resultado")return(
    <div style={{minHeight:"100vh",background:"#f5f6fa"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",padding:"48px 20px 24px"}}>
        <p style={{color:"rgba(255,255,255,0.7)",fontSize:"13px",marginBottom:"8px"}}>{aluno.nome} · Turma {turma}</p>
        <div style={{display:"flex",alignItems:"flex-end",gap:"16px"}}>
          <div style={{background:"rgba(255,255,255,0.12)",borderRadius:"16px",padding:"12px 24px",textAlign:"center"}}>
            <p style={{color:"rgba(255,255,255,0.6)",fontSize:"11px",letterSpacing:"1px",marginBottom:"4px"}}>NOTA</p>
            <p style={{color:"#fff",fontWeight:"800",fontSize:"44px",lineHeight:1}}>{nota}</p>
          </div>
          <div style={{paddingBottom:"8px"}}>
            <p style={{color:"#fff",fontWeight:"700",fontSize:"22px"}}>{acertos}/{total}</p>
            <p style={{color:"rgba(255,255,255,0.6)",fontSize:"13px"}}>acertos</p>
          </div>
        </div>
      </div>
      <div style={{padding:"16px 20px"}}>
        <p style={{fontSize:"12px",fontWeight:"600",color:"#999",textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:"10px"}}>Questao por questao</p>
        {gabarito.map((gab,i)=>{
          const resp=respostas[i];const acertou=resp&&resp===(gab||"").toUpperCase();const vazio=!resp;
          return(<div key={i} className={"fadein "+(vazio?"branco":acertou?"acerto":"cerro")} style={{borderRadius:"10px",padding:"12px 16px",marginBottom:"8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <span style={{fontWeight:"700",color:"#666",fontSize:"14px",minWidth:"24px"}}>{i+1}.</span>
              <div>
                <span style={{fontSize:"13px",color:"#666"}}>Resp: <strong style={{color:vazio?"#bbb":acertou?"#2e7d32":"#c62828"}}>{resp||"—"}</strong></span>
                <span style={{fontSize:"13px",color:"#aaa",marginLeft:"12px"}}>Gab: <strong style={{color:"#333"}}>{(gab||"").toUpperCase()}</strong></span>
              </div>
            </div>
            <span style={{fontSize:"18px"}}>{vazio?"□":acertou?"✓":"✗"}</span>
          </div>);
        })}
        <div style={{display:"flex",gap:"10px",marginTop:"16px"}}>
          <button onClick={()=>{setFotoUrl(null);setImgEl(null);setEtapa("instrucao");}} style={{flex:1,padding:"14px",background:"#fff",border:"2px solid #e0e0e0",borderRadius:"12px",fontSize:"14px",fontWeight:"600",color:"#555",cursor:"pointer"}}>&#128247; Refazer</button>
          <button onClick={()=>onSalvar({alunoId:aluno.id,nomeAluno:aluno.nome,turma,acertos,total,nota,data:new Date().toLocaleDateString("pt-BR")})}
            style={{flex:2,padding:"14px",background:"linear-gradient(135deg,#2e7d32,#388e3c)",border:"none",borderRadius:"12px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:"pointer",boxShadow:"0 4px 14px rgba(46,125,50,0.3)"}}>
            &#10003; Salvar Nota
          </button>
        </div>
      </div>
    </div>
  );
  return null;
}

// ─── TELA NOTAS SALVAS ─────────────────────────────────────────────────────────
function TelaNotas({correcoes,provas,onVoltar}){
  const [filtroProva,setFiltroProva]=React.useState("");
  const provasComNota=[...new Set(correcoes.map(c=>c.provaId))];
  const provasFiltradas=filtroProva?correcoes.filter(c=>c.provaId===filtroProva):correcoes;
  const prova=filtroProva?provas.find(p=>p.id===filtroProva):null;
  const porTurma=provasFiltradas.reduce((acc,c)=>{const k=c.turma||"Sem turma";if(!acc[k])acc[k]=[];acc[k].push(c);return acc;},{});
  function handleExportar(){
    if(!filtroProva){alert("Selecione uma prova primeiro.");return;}
    exportarExcel(provasFiltradas,prova||{titulo:"notas"});
  }
  return(
    <div style={{minHeight:"100vh",background:"#f5f6fa"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",padding:"48px 20px 24px"}}>
        <button onClick={onVoltar} style={{background:"none",border:"none",color:"rgba(255,255,255,0.7)",fontSize:"14px",cursor:"pointer",marginBottom:"14px",padding:0}}>&#8592; Voltar</button>
        <p style={{color:"#fff",fontWeight:"700",fontSize:"20px"}}>&#128200; Notas Salvas</p>
        <p style={{color:"rgba(255,255,255,0.6)",fontSize:"13px",marginTop:"4px"}}>{correcoes.length} correcao{correcoes.length!==1?"oes":""} no total</p>
      </div>
      <div style={{padding:"16px 20px"}}>
        <select style={{width:"100%",padding:"12px",border:"1px solid #ddd",borderRadius:"10px",fontSize:"14px",outline:"none",marginBottom:"16px",background:"#fff"}} value={filtroProva} onChange={e=>setFiltroProva(e.target.value)}>
          <option value="">Todas as provas</option>
          {provasComNota.map(id=>{const p=provas.find(x=>x.id===id);return<option key={id} value={id}>{p?.titulo||id}</option>;})}
        </select>
        {filtroProva&&(
          <button onClick={handleExportar} style={{width:"100%",padding:"14px",background:"linear-gradient(135deg,#2e7d32,#388e3c)",border:"none",borderRadius:"12px",color:"#fff",fontSize:"15px",fontWeight:"700",cursor:"pointer",marginBottom:"16px",boxShadow:"0 4px 14px rgba(46,125,50,0.3)"}}>
            &#128229; Exportar Excel — {provasFiltradas.length} alunos
          </button>
        )}
        {Object.entries(porTurma).map(([turma,lista])=>(
          <div key={turma} style={{marginBottom:"20px"}}>
            <p style={{fontSize:"12px",fontWeight:"700",color:"#4361ee",textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:"8px"}}>Turma {turma}</p>
            {lista.sort((a,b)=>a.nomeAluno.localeCompare(b.nomeAluno)).map((c,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:"10px",padding:"12px 16px",marginBottom:"6px",boxShadow:"0 1px 4px rgba(0,0,0,0.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <p style={{fontWeight:"600",fontSize:"14px",color:"#1a1a2e",marginBottom:"2px"}}>{c.nomeAluno}</p>
                  <p style={{fontSize:"12px",color:"#999"}}>{c.acertos}/{c.total} acertos · {c.data}</p>
                </div>
                <div style={{textAlign:"right"}}>
                  <p style={{fontWeight:"800",fontSize:"22px",color:c.nota>=7?"#2e7d32":c.nota>=5?"#e65100":"#c62828"}}>{c.nota}</p>
                </div>
              </div>
            ))}
          </div>
        ))}
        {provasFiltradas.length===0&&(<div style={{textAlign:"center",padding:"40px",color:"#aaa"}}>Nenhuma correcao encontrada.</div>)}
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ─────────────────────────────────────────────────────────────
function App(){
  const [tela,setTela]=React.useState("login");
  const [token,setToken]=React.useState(null);
  const [usuario,setUsuario]=React.useState(null);
  const [provas,setProvas]=React.useState([]);
  const [alunos,setAlunos]=React.useState([]);
  const [prova,setProva]=React.useState(null);
  const [aluno,setAluno]=React.useState(null);
  const [turma,setTurma]=React.useState("");
  const [correcoes,setCorrecoes]=React.useState(()=>{
    try{return JSON.parse(localStorage.getItem("correcoes")||"[]");}catch{return[];}
  });

  function salvarCorrecao(dados){
    const nova={...dados,provaId:prova.id,provaTitulo:prova.titulo};
    const novas=[...correcoes.filter(c=>!(c.provaId===nova.provaId&&c.alunoId===nova.alunoId)),nova];
    setCorrecoes(novas);
    try{localStorage.setItem("correcoes",JSON.stringify(novas));}catch(_){}
    setTela("aluno");
  }

  function onLogin(t,u,d){
    setToken(t);setUsuario(u);
    setProvas(d.provas||[]);
    setAlunos(d.alunos||[]);
    setTela("provas");
  }

  if(tela==="login")return <TelaLogin onLogin={onLogin}/>;
  if(tela==="provas")return <TelaProvas usuario={usuario} provas={provas} onSelecionar={p=>{setProva(p);setTela("aluno");}} onVerNotas={()=>setTela("notas")} onLogout={()=>{setToken(null);setUsuario(null);setTela("login");}}/>;
  if(tela==="aluno")return <TelaAluno prova={prova} alunos={alunos} correcoes={correcoes.filter(c=>c.provaId===prova?.id)} onConfirmar={(a,t)=>{setAluno(a);setTurma(t);setTela("correcao");}} onVoltar={()=>setTela("provas")}/>;
  if(tela==="correcao")return <TelaCorrecao prova={prova} aluno={aluno} turma={turma} onSalvar={salvarCorrecao} onVoltar={()=>setTela("aluno")}/>;
  if(tela==="notas")return <TelaNotas correcoes={correcoes} provas={provas} onVoltar={()=>setTela("provas")}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
